user root;
worker_processes auto;
# 提升文件句柄上限，确保高并发连接不被系统拦截
worker_rlimit_nofile 65535;

events {
    worker_connections 20480; # 翻倍到 2 万，应对 300 人及其产生的并发 API 请求
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- 基础性能优化 ---
    sendfile on;
    tcp_nopush on; # 结合 sendfile，提高大文件传输效率
    tcp_nodelay on; # 减少延迟，直播必备

    # --- 解决 unexpected EOF 的核心参数 ---
    # 增加输出缓冲区。HLS 切片通常较大，增加缓冲区可减少由于频繁 I/O 导致的断流
    output_buffers 2 512k;
    postpone_output 1460; # 等到数据量达到 MTU 大小时再发送，提高网络利用率

    # 增加超时宽容度。如果测试机网卡满了导致确认包（ACK）变慢，Nginx 不会立刻断开
    send_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 5000;

    # --- 内存盘缓存优化 ---
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    server {
        listen 80;
        server_name localhost;

        # 1. HLS 视频切片分发优化
        location /hls {
            alias /usr/share/nginx/html/hls;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin *;
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            open_file_cache off;
            open_file_cache_errors off;
            output_buffers 4 1024k;
        }

        # 2. Owncast 常规接口与 WebSocket 代理
        location / {
            proxy_pass http://owncast:8080;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 增加代理超时，防止后台管理或聊天接口断连
            proxy_read_timeout 600s;
        }
    }
}
